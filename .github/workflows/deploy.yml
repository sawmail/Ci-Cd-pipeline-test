name: Deploy

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build standalone bundle
        run: pnpm build
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
      - name: Stage deploy files
        run: |
          rm -rf dist-deploy
          mkdir -p dist-deploy/.next
          cp -R .next/standalone/. dist-deploy/
          cp -R .next/static dist-deploy/.next/static
          cp -R public/. dist-deploy/

      - name: Deploy files to Webuzo FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
